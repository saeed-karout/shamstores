name = "subdomain-proxy"
main = "index.js"
compatibility_date = "2026-05-17"

# المسارات مُدارة من هنا لا من اللوحة، حتى لا يضيع مسار عند إعادة النشر.
#
# ⚠️ المسار الأول ضروري: الحزمة تنادي /api نسبياً، فبدون تغطية النطاق الرئيسي
#    يذهب /api إلى الواجهة الثابتة ويعود بـ index.html بدل JSON.
#    (هذا ما حدث فعلاً: *.shamstores.com كان مربوطاً والجذر لا.)

[[routes]]
pattern = "shamstores.com/*"
zone_name = "shamstores.com"

[[routes]]
pattern = "www.shamstores.com/*"
zone_name = "shamstores.com"

[[routes]]
pattern = "*.shamstores.com/*"
zone_name = "shamstores.com"
